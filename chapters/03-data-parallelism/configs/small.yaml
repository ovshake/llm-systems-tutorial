seed: 0
model:
  vocab_size: 50257
  n_layers: 12
  n_heads: 12
  n_kv_heads: 12
  hidden_size: 768
  intermediate_size: 3072
  context_length: 1024
  dropout: 0.0
  use_grad_checkpoint: false

data:
  train_path: ../01-transformer-from-scratch/data/tinyshakespeare/train.bin

seq_len: 1024
micro_batch: 16            # per-rank batch
accum_steps: 1
total_steps: 1000
lr: 0.0003
