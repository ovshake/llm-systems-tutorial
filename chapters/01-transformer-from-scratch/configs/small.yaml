# GPT-2 small (~125M) on TinyShakespeare. Real-ish training run on one A100.
model:
  vocab_size: 50257
  n_layers: 12
  n_heads: 12
  n_kv_heads: 12
  hidden_size: 768
  intermediate_size: 3072
  context_length: 1024
  rope_base: 10000.0
  dropout: 0.0
  use_grad_checkpoint: false   # flip on for Exercise 4

data:
  train_path: data/tinyshakespeare/train.bin
  val_path:   data/tinyshakespeare/val.bin

seq_len: 1024
micro_batch: 32
accum_steps: 1
total_steps: 5000
warmup_steps: 200
lr: 0.0003
min_lr: 0.00003
betas: [0.9, 0.95]
weight_decay: 0.1
grad_clip: 1.0
bf16: true
compile: false
log_every: 20
save_every: 1000

out_dir: runs/small
